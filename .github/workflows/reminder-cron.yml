name: Demo reminder trigger

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the protected reminder cycle
        env:
          REMINDER_CRON_URL: ${{ secrets.REMINDER_CRON_URL }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          test -n "$REMINDER_CRON_URL"
          test -n "$REMINDER_CRON_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 180 \
            -X POST "$REMINDER_CRON_URL" \
            -H "x-reminder-cron-secret: $REMINDER_CRON_SECRET"
