services:
  - type: web
    name: duenest-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false
      - key: REMINDER_SCHEDULER_ENABLED
        value: "false"
