services:
  - type: web
    name: duenest-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: server
    dockerfilePath: ./Dockerfile
    preDeployCommand: npm run prisma:migrate
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: duenest-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: duenest-db
    databaseName: duenest
    user: duenest
    region: frankfurt
    plan: 0.5c-1g
    diskSizeGB: 10
    postgresMajorVersion: "16"
